spring.application.name=mportal


# MySQL 드라이버 설정 (Spring Boot 3.x 이상은 생략 가능하지만 명시하는 것이 좋습니다)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL 연결 URL (localhost:3306 뒤에 본인의 데이터베이스(Schema) 이름을 적어주세요)
spring.datasource.url=jdbc:mysql://localhost:3306/cpsdb?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true

# MySQL 계정 정보
spring.datasource.username=cpsdb
spring.datasource.password=cpsxxx


spring.mybatis.mapper-locations=classpath:mapper/**/*.xml
spring.mybatis.type-aliases-package=com.hynix.hcp.mportal.model
spring.mybatis.configuration.map-underscore-to-camel-case=true

# Set logging levels
logging.level.root=DEBUG
://level.com.yourcompany=DEBUG

# File logging with rotation
logging.file.name=logs/app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# Custom pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


